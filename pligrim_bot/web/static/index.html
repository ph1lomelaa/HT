<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efe6">
  <meta name="description" content="Hickmet Workspace — оформление ваучеров для паломников. Выберите пакет, проверьте детали и получите документы в Telegram.">
  <title>Hickmet · Ваучеры</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="header"><div class="container header-inner">
    <a href="/" class="brand" aria-label="Hickmet — главная"><span class="brand-symbol">H</span><span><strong>HICKMET</strong><small>ВАУЧЕРЫ</small></span></a>
    <button class="account" data-action="account"><span class="account-icon" id="account-icon"></span><span id="account-name">Войти через Telegram</span></button>
  </div></header>
  <main id="main"></main>
  <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
    <button class="dialog-close" data-action="close-login" aria-label="Закрыть">×</button>
    <div class="dialog-symbol">H</div><p class="eyebrow">ВАШ ЛИЧНЫЙ КАБИНЕТ</p><h2 id="login-title">Продолжим в Telegram</h2>
    <p class="muted">Подтвердите вход в нашем боте, чтобы выбирать пакеты и получать готовые документы в свой чат.</p>
    <div id="login-status"></div>
    <a id="telegram-login-link" class="button primary" target="_blank" rel="noopener">Открыть Telegram <span>↗</span></a>
    <p class="fine-print">После подтверждения вернитесь сюда.<br>Страница продолжит оформление автоматически.</p>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>Для оформления ваучеров включите JavaScript в браузере.</noscript>
</body>
</html>
