services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WEBAPP_URL: https://voucherhickmet.duckdns.org
      WEB_STATE_DIR: /app/pligrim_bot/data/runtime
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service_account.json
    volumes:
      - web_state:/app/pligrim_bot/data/runtime
      - ./pligrim_bot/credentials/service_account.json:/run/secrets/service_account.json:ro
  web:
    build: .
    command: ["python", "-m", "uvicorn", "pligrim_bot.web.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    env_file: .env
    environment:
      WEBAPP_URL: https://voucherhickmet.duckdns.org
      WEB_STATE_DIR: /app/pligrim_bot/data/runtime
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service_account.json
    volumes:
      - web_state:/app/pligrim_bot/data/runtime
      - ./pligrim_bot/credentials/service_account.json:/run/secrets/service_account.json:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    networks:
      default:
      proxy:
        aliases: ["hickmet-voucher-web"]

volumes:
  web_state:

networks:
  proxy:
    external: true
    name: ${CADDY_NETWORK:-infra_infra_net}
